<style>
/* VARIAVEIS DE CORES V7 */
:root {
    --primary: #003366 !important;
    --primary-gradient: linear-gradient(135deg, #003366 0%, #001a33 100%) !important;
    --green: #2ECC71 !important;
    --red: #FF3B30 !important;
    --orange: #FF9F0A !important;
    --bg: #F2F5F9 !important;
    --card: #ffffff !important;
    --text: #1C2C40 !important;
    --muted: #64748B !important;
    --blue-light: #007AFF !important;
    --shadow-sm: 0 4px 10px rgba(0, 0, 0, 0.03) !important;
    --shadow-md: 0 10px 25px rgba(0, 51, 102, 0.08) !important;
    --radius-lg: 24px !important;
}

/* SISTEMA ANTI-CÓPIA */
* {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    -webkit-touch-callout: none; text-decoration: none;
}

body {
    background-color: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    padding-bottom: 20px;
    display: flex; flex-direction: column; align-items: center;
}

/* ================= HEADER V7 (Otimizado para Exame) ================= */
header {
    background: var(--primary-gradient);
    width: 100%; padding: 20px 20px 30px;
    border-radius: 0 0 35px 35px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 10px 25px rgba(0, 51, 102, 0.2);
    position: sticky; top: 0; z-index: 1000;
}

.brand-container { color: white; }
.brand-title { font-size: 1.4rem; font-family: 'Montserrat', sans-serif; font-weight: 800; letter-spacing: -0.5px; }
.brand-title span { color: var(--green); }
.brand-subtitle { font-size: 0.75rem; font-weight: 600; opacity: 0.9; margin-top: 2px; }

.header-right { display: flex; gap: 10px; align-items: center; }

.timer-box {
    background: rgba(255,255,255,0.15); color: white;
    padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 1rem;
    backdrop-filter: blur(5px);
}
.timer-box i { font-size: 0.9rem; color: var(--orange); }

.btn-terminar {
    background: var(--red); color: white; border: none;
    padding: 10px 15px; border-radius: 12px; font-weight: 800; cursor: pointer;
    font-size: 0.8rem; box-shadow: 0 4px 10px rgba(255, 59, 48, 0.3); text-transform: uppercase;
}
.btn-terminar:active { transform: scale(0.95); }

/* ================= BARRA DE PAGINAÇÃO V7 ================= */
.nav-wrapper {
    width: 100%; max-width: 600px; display: flex; align-items: center; gap: 10px;
    background: transparent; padding: 15px 20px;
    margin-top: -15px; z-index: 999;
}
.nav-container {
    display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none;
    flex-grow: 1; padding: 5px 0;
}
.nav-container::-webkit-scrollbar { display: none; }

.nav-btn {
    background: var(--card); color: var(--primary); border: 1px solid rgba(226,232,240,0.8);
    width: 45px; height: 45px; border-radius: 14px; font-size: 1.1rem;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; flex-shrink: 0; box-shadow: var(--shadow-sm);
}
.nav-btn:active { background: #E2E8F0; transform: scale(0.95); }

.page-num {
    min-width: 42px; height: 42px; background: var(--card); color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px; font-weight: 700; cursor: pointer; border: 1px solid rgba(226,232,240,0.8);
    box-shadow: var(--shadow-sm); transition: all 0.2s; font-size: 0.9rem; flex-shrink: 0;
}
.page-num.active { background: var(--blue-light); color: white; border-color: var(--blue-light); transform: translateY(-2px); box-shadow: 0 5px 12px rgba(0,122,255,0.3); }
.page-num.answered { border-bottom: 4px solid var(--green); color: var(--primary); }

/* Cores após a correção */
.page-num.rev-correct { background: var(--green) !important; color: white !important; border-color: var(--green) !important; }
.page-num.rev-wrong { background: var(--red) !important; color: white !important; border-color: var(--red) !important; }

/* ================= ÁREA DA PERGUNTA V7 ================= */
.container { width: 100%; max-width: 550px; padding: 0 20px; }

.question-wrapper { display: none; animation: slideUpFade 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
.question-wrapper.active { display: block; }

@keyframes slideUpFade {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.card-inner {
    background: var(--card); border-radius: var(--radius-lg); padding: 20px;
    box-shadow: var(--shadow-md); border: 1px solid rgba(226, 232, 240, 0.6);
}

.q-img { width: 100%; height: auto; max-height: 250px; object-fit: contain; border-radius: 16px; margin-bottom: 15px; pointer-events: none; display: block; }
.q-text-area { font-weight: 800; font-size: 1.05rem; color: var(--primary); margin-bottom: 20px; line-height: 1.4; }

/* ================= OPÇÕES V7 ================= */
.options-container { display: flex; flex-direction: column; gap: 12px; }

.option {
    display: flex; align-items: center; background: #F8FAFC;
    border: 2px solid #E2E8F0; border-radius: 16px; padding: 12px 15px;
    cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text);
    transition: all 0.2s;
}
.option input { display: none; }

.option-letter {
    background: var(--primary); color: white; border-radius: 10px;
    width: 34px; height: 34px; display: flex; align-items: center;
    justify-content: center; font-weight: 800; margin-right: 12px; flex-shrink: 0; font-size: 0.9rem;
}

/* Estado Selecionado */
.option:has(input:checked) { border-color: var(--blue-light); background: rgba(0, 122, 255, 0.05); }
.option:has(input:checked) .option-letter { background: var(--blue-light); }

/* Correção Final */
.correct-ans { background: rgba(46, 204, 113, 0.1) !important; border-color: var(--green) !important; }
.correct-ans .option-letter { background: var(--green) !important; }
.wrong-ans { background: rgba(255, 59, 48, 0.1) !important; border-color: var(--red) !important; }
.wrong-ans .option-letter { background: var(--red) !important; }

.label-certa {
    background: var(--green); color: white; font-size: 0.65rem; padding: 4px 8px;
    border-radius: 8px; margin-left: auto; font-weight: 800; display: none;
}

/* Trava após fim */
.exam-finished .option { pointer-events: none; }

/* ================= MODAL DE RESULTADO V7 ================= */
.modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px);
    z-index: 2000; justify-content: center; align-items: center; padding: 20px;
}
.modal-content {
    background: white; width: 100%; max-width: 360px; border-radius: var(--radius-lg);
    padding: 30px 25px; text-align: center; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

#modalIcon { font-size: 3.5rem; margin-bottom: 10px; }
.modal-status { font-size: 1.8rem; font-family: 'Montserrat', sans-serif; font-weight: 800; margin-bottom: 20px; }
.status-reprovado { color: var(--red); }
.status-aprovado { color: var(--green); }

.modal-stats { display: flex; justify-content: space-around; background: #F8FAFC; padding: 15px; border-radius: 16px; margin-bottom: 25px; border: 1px solid #E2E8F0; }
.modal-stats div { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.stat-value { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
.text-green { color: var(--green); }
.text-red { color: var(--red); }

.modal-footer { display: flex; flex-direction: column; gap: 10px; }
.btn-ver {
    background: var(--blue-light); color: white; padding: 14px; border-radius: 14px;
    font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; border: none; width: 100%;
}
.btn-sair {
    background: #EEF2F7; color: var(--primary); padding: 14px; border-radius: 14px;
    font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; border: none; width: 100%;
}

</style>
</head>

    ];

    let currentIdx = 0;
    let time = 3600;
    let countdown;
    let isExamFinished = false;
    let userAnswers = {};

    function init() {
        renderQuestions();
        startTimer();
    }

    function renderQuestions() {
        document.getElementById('q_list').innerHTML = '';
        document.getElementById('pagination_bar').innerHTML = '';
        questions.forEach((item, index) => {
            document.getElementById('pagination_bar').innerHTML += `<div class="page-num ${index === 0 ? 'active' : ''}" id="page_${index}" onclick="goToQuestion(${index})">${index + 1}</div>`;

            let optionsHtml = '';
            for(let key in item.options) {
                optionsHtml += `
                    <label class="option" id="label-${item.id}-${key}">
                        <div class="option-letter">${key}</div>
                        <input type="radio" name="q${item.id}" value="${key}" onchange="saveProgress(${index}, '${item.id}', '${key}')">
                        <span>${item.options[key]}</span>
                        <span class="label-certa" id="certa-${item.id}-${key}">CORRETA</span>
                    </label>`;
            }

            document.getElementById('q_list').innerHTML += `
                <div class="question-wrapper ${index === 0 ? 'active' : ''}" id="q_wrap_${index}">
                    <div class="card-inner">
                        <img src="${item.img}" class="q-img" loading="lazy">
                        <div class="q-text-area">${item.q}</div>
                        <div class="options-container">${optionsHtml}</div>
                    </div>
                </div>`;
        });
    }

    function saveProgress(index, qId, val) {
        if (isExamFinished) return;
        userAnswers[`q${qId}`] = val;
        document.getElementById(`page_${index}`).classList.add('answered');
        setTimeout(() => nextQ(), 350); // Transição suave
    }

    function startTimer() {
        clearInterval(countdown);
        countdown = setInterval(() => {
            if (time <= 0) { checkExam(); } else { time--; updateTimerDisplay(); }
        }, 1000);
    }

    function updateTimerDisplay() {
        let m = Math.floor(time / 60), s = time % 60;
        document.getElementById('timer').innerHTML = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function goToQuestion(index) {
        if (index < 0 || index >= questions.length) return;
        currentIdx = index;
        document.querySelectorAll('.question-wrapper').forEach(w => w.classList.remove('active'));
        document.querySelectorAll('.page-num').forEach(p => p.classList.remove('active'));
        document.getElementById(`q_wrap_${index}`).classList.add('active');
        document.getElementById(`page_${index}`).classList.add('active');
        
        // Mantém a barra de paginação focada na questão atual
        document.getElementById(`page_${index}`).scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    function nextQ() { goToQuestion(currentIdx + 1); }
    function prevQ() { goToQuestion(currentIdx - 1); }

    async function checkExam() {
        if (isExamFinished) return;
        clearInterval(countdown);
        isExamFinished = true;
        
        // Bloqueia cliques nas opções após finalizar
        document.getElementById('exam').classList.add('exam-finished');
        
        let score = 0;
        questions.forEach((item, index) => {
            const userAns = userAnswers[`q${item.id}`];
            const isCorrect = userAns === item.ans;
            
            // Marca sempre a opção correta
            document.getElementById(`label-${item.id}-${item.ans}`).classList.add('correct-ans');
            document.getElementById(`certa-${item.id}-${item.ans}`).style.display = 'block';
            
            // Pinta de vermelho a opção errada se o aluno tiver escolhido
            if (userAns && !isCorrect) {
                document.getElementById(`label-${item.id}-${userAns}`).classList.add('wrong-ans');
            }

            // Atualiza a cor dos botões na paginação
            const pageBtn = document.getElementById(`page_${index}`);
            if (isCorrect) {
                score++;
                pageBtn.classList.add('rev-correct');
            } else {
                pageBtn.classList.add('rev-wrong');
            }
        });

        showModal(score);

        // ==========================================
        // CÓDIGO NOVO: GRAVAR HISTÓRICO NO SUPABASE
        // ==========================================
        const totalErros = questions.length - score;
        const percentagem = Math.round((score / questions.length) * 100);

        try {
            const userDataJson = localStorage.getItem('usuarioLogado');
            if (userDataJson) {
                const userData = JSON.parse(userDataJson);
                
                await _supabase.from('Historico_Exames').insert([{ 
                    user_id: userData.id, 
                    modulo: 'pesados', 
                    percentagem: percentagem, 
                    acertos: score, 
                    erros: totalErros 
                }]);
            }
        } catch(e) {
            console.error('Erro ao guardar histórico:', e);
        }

        // Salva na memória do telefone sem falhas (Original mantido)
        const dadosParaSalvar = {
            nome: NOME_DO_EXAME,
            acertos: score,
            total: questions.length,
            data: new Date().toLocaleDateString('pt-MZ')
        };
        localStorage.setItem(EXAME_ID_UNICO, JSON.stringify(dadosParaSalvar));
    }

    function showModal(score) {
        const aprovado = score >= 18;
        const modal = document.getElementById('modalRes');
        const title = document.getElementById('modalTitle');
        
        title.innerText = aprovado ? "Aprovado!" : "Reprovado";
        title.className = "modal-status " + (aprovado ? "status-aprovado" : "status-reprovado");
        document.getElementById('modalIcon').innerHTML = aprovado ? "🏆" : "❌";
        
        document.getElementById('resAcertos').innerText = score;
        document.getElementById('resErros').innerText = questions.length - score;
        document.getElementById('resMedia').innerText = score;
        
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modalRes').style.display = 'none';
        document.getElementById('btnFinish').style.display = 'none';
        goToQuestion(0);
    }

    init();
</script>
