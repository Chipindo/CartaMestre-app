<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA - Código da Estrada</title>
    <!-- Importar o Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f1f5f9;
            --chat-bg: #ffffff;
            --text-main: #1e293b;
            --msg-user: #2563eb;
            --msg-ia: #f3f4f6;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        /* ALTERADO: Removemos o padding e metemos height a 100% da tela */
        body { background-color: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        /* ALTERADO: O chat agora ocupa 100% da largura e altura (Fullscreen) */
        .chat-container {
            background: var(--chat-bg);
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #fafafa;
        }

        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }

        .msg.user {
            background-color: var(--msg-user);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg.ia {
            background-color: var(--msg-ia);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        /* NOVO: Estilo dos "Vistos" tipo WhatsApp */
        .tick {
            font-size: 13px;
            margin-left: 8px;
            color: #cbd5e1; /* Cor cinza (Enviado) */
            display: inline-block;
        }
        .tick.read {
            color: #60a5fa; /* Cor azul claro (Lido) */
            font-weight: bold;
        }

        /* NOVO: Estilo do Indicador de digitação */
        #typing-indicator {
            padding: 5px 20px 10px;
            font-size: 13px;
            color: var(--primary);
            font-style: italic;
            display: none; /* Escondido por padrão */
            background-color: #fafafa;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid var(--border);
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        .chat-input-area input:focus { border-color: var(--primary); }

        .chat-input-area button {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
        }

        .chat-input-area button:hover { background: var(--primary-hover); }
        .chat-input-area button:disabled { background: #94a3b8; cursor: not-allowed; }

        /* Loader simples para estado do sistema */
        #status-bar {
            text-align: center;
            font-size: 12px;
            color: #64748b;
            padding: 5px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">Instrutor IA - Carta Mestre</div>
        <div id="status-bar">A conectar ao servidor...</div>
        
        <div class="chat-box" id="chat-box">
            <!-- As mensagens vão aparecer aqui -->
        </div>

        <!-- NOVO: Indicador de escrita -->
        <div id="typing-indicator">A IA está a escrever...</div>

        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Faz uma pergunta sobre o código da estrada..." disabled>
            <button id="btn-send" onclick="enviarMensagem()" disabled>Enviar</button>
        </div>
    </div>

    <script>
        // 1. Configuração do Supabase
        const SUPABASE_URL = 'https://vhcioxwuombrqkhkipdh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_XW2XlyZRe0IOotl6fpRXGQ_w6_-32AF';
        const supabaseUrl = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let chavesAtivas = [];
        let chaveAtualIndex = 0;
        let versaoModelo = "gemini-1.5-flash";
        let regrasSistema = "";
        let historicoMensagens = [];

        // 2. Carregar Configurações do Supabase ao abrir o chat
        async function inicializarIA() {
            try {
                const { data, error } = await supabaseUrl.from('ConfiguracoesIA').select('*').eq('id', 1).single();
                
                if (error) throw error;

                if (data) {
                    chavesAtivas = (data.chaves_api || '').split(/[\n,]+/).map(c => c.trim()).filter(c => c !== "");
                    versaoModelo = data.versao_modelo || "gemini-1.5-flash";
                    regrasSistema = `${data.regras || ''}\n\nBase de Conhecimento (Código da Estrada):\n${data.codigo_estrada || ''}`;
                    
                    document.getElementById('status-bar').innerText = "Sistema Online - Pronto a ajudar!";
                    document.getElementById('status-bar').style.color = "#10b981";
                    
                    document.getElementById('user-input').disabled = false;
                    document.getElementById('btn-send').disabled = false;
                    
                    adicionarMensagem('ia', "Olá! Sou o teu instrutor virtual. Como te posso ajudar hoje com o código da estrada?");
                }
            } catch (error) {
                console.error("Erro ao ligar ao Supabase:", error);
                document.getElementById('status-bar').innerText = "Erro ao carregar sistema.";
                document.getElementById('status-bar').style.color = "red";
                adicionarMensagem("ia", "Sistema em manutenção. Não foi possível carregar as configurações do servidor.");
            }
        }

        // 3. Adicionar mensagem visual no HTML
        function adicionarMensagem(tipo, texto) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = 'msg ' + tipo;
            
            // Sanitiza o texto, converte formatos do Markdown, substitui asteriscos de lista e adiciona quebras
            let textoSeguro = texto
                .replace(/</g, "&lt;") // Segurança HTML
                .replace(/>/g, "&gt;") // Segurança HTML
                .replace(/(^|\n)#{1,6}\s+(.*)/g, '$1<strong>$2</strong>') // AJUSTE AQUI: Remove #### de títulos e coloca em negrito
                .replace(/(^|\n)---+(\n|$)/g, '$1<hr style="border:0; border-top:1px solid #cbd5e1; margin:10px 0;">$2') // AJUSTE AQUI: Converte "---" para uma linha divisória elegante
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Converte **texto** para negrito
                .replace(/(^|\n)\s*\*\s+/g, '$1• ') // AJUSTE AQUI: Apanha o "*" do início da frase (mesmo com espaços) e transforma em "•"
                .replace(/\n/g, '<br>'); // Quebra de linha HTML
            
            // Adicionar os checks estilo WhatsApp para as mensagens do utilizador
            if (tipo === 'user') {
                const tickId = 'tick-' + Date.now(); 
                textoSeguro += `<span class="tick" id="${tickId}">✓</span>`; 
                
                setTimeout(() => {
                    const tickElement = document.getElementById(tickId);
                    if (tickElement) {
                        tickElement.innerText = '✓✓';
                        tickElement.classList.add('read');
                    }
                }, 800); 
            }

            div.innerHTML = textoSeguro;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // 4. Enviar mensagem do utilizador
        async function enviarMensagem() {
            const input = document.getElementById('user-input');
            const textoUser = input.value.trim();
            if (!textoUser) return;
            
            if (chavesAtivas.length === 0) {
                alert("O sistema ainda não possui chaves de API configuradas. Contacta o administrador.");
                return;
            }

            input.blur(); // AJUSTE AQUI: Remove o foco do input para esconder o teclado no telemóvel ao enviar a mensagem.

            adicionarMensagem('user', textoUser);
            input.value = '';
            
            historicoMensagens.push({ role: "user", parts: [{ text: textoUser }] });
            
            document.getElementById('btn-send').disabled = true;
            document.getElementById('user-input').disabled = true;
            document.getElementById('btn-send').innerText = '...';

            document.getElementById('typing-indicator').style.display = 'block';
            document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;

            await pedirRespostaGemini();
        }

        // 5. Chamar o Gemini usando a versão configurada e rotação de chaves
        async function pedirRespostaGemini() {
            let chaveApi = chavesAtivas[chaveAtualIndex];
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${versaoModelo}:generateContent?key=${chaveApi}`;
            
            const payload = {
                system_instruction: { parts: [{ text: regrasSistema }] },
                contents: historicoMensagens
            };

            try {
                const resposta = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!resposta.ok) {
                    throw new Error(`Erro na API (Status: ${resposta.status})`);
                }

                const dados = await resposta.json();
                const textoResposta = dados.candidates[0].content.parts[0].text;
                
                document.getElementById('typing-indicator').style.display = 'none';

                adicionarMensagem('ia', textoResposta);
                historicoMensagens.push({ role: "model", parts: [{ text: textoResposta }] });
                
                resetBotao();

            } catch (erro) {
                console.error("Falha com a chave no índice", chaveAtualIndex, erro);
                
                if (chaveAtualIndex < chavesAtivas.length - 1) {
                    chaveAtualIndex++;
                    console.log("A tentar com a próxima chave de API...");
                    await pedirRespostaGemini();
                } else {
                    document.getElementById('typing-indicator').style.display = 'none';

                    adicionarMensagem('ia', "Desculpa, os nossos servidores estão sobrecarregados neste momento. Tenta novamente mais tarde.");
                    historicoMensagens.pop();
                    chaveAtualIndex = 0;
                    resetBotao();
                }
            }
        }

        // 6. Voltar a ativar os controlos
        function resetBotao() {
            document.getElementById('btn-send').disabled = false;
            document.getElementById('user-input').disabled = false;
            document.getElementById('btn-send').innerText = 'Enviar';
            // AJUSTE AQUI: Removido o .focus() para que o teclado não abra automaticamente após a IA responder.
        }

        // 7. Permitir envio com a tecla "Enter"
        document.getElementById("user-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                enviarMensagem();
            }
        });

        // Iniciar
        window.onload = inicializarIA;
    </script>
</body>
</html>
