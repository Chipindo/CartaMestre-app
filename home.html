<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel - Carta Mestre</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text-main: #1e293b; --text-muted: #64748b; --card-bg: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-main); padding-bottom: 70px; }
        
        /* Header */
        .app-header { background: var(--primary); color: white; padding: 25px 20px 40px 20px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; box-shadow: 0 4px 15px rgba(37,99,235,0.2); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-greeting { font-size: 22px; font-weight: bold; }
        .avatar { width: 45px; height: 45px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        /* Dashboard Container */
        .container { padding: 0 20px; margin-top: -25px; }
        
        /* Status Card */
        .status-card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .status-info h3 { font-size: 15px; color: var(--text-muted); font-weight: normal; margin-bottom: 5px; }
        .status-info p { font-size: 24px; font-weight: bold; color: var(--text-main); }
        .status-badge { background: #dcfce7; color: #166534; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        
        /* Grid de Ações */
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: var(--text-main); }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .menu-card { background: var(--card-bg); padding: 20px 15px; border-radius: 16px; text-align: center; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.04); transition: transform 0.2s; border: 1px solid #f1f5f9; display: flex; flex-direction: column; align-items: center; }
        .menu-card:active { transform: scale(0.96); }
        .menu-icon { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 12px; }
        .icon-blue { background: #eff6ff; color: #2563eb; }
        .icon-purple { background: #faf5ff; color: #9333ea; }
        .icon-orange { background: #fff7ed; color: #ea580c; }
        .icon-green { background: #f0fdf4; color: #16a34a; }
        .menu-card h4 { font-size: 14px; color: var(--text-main); margin-bottom: 4px; }
        .menu-card p { font-size: 11px; color: var(--text-muted); }
        
        /* Bottom Navigation Bar (Estilo App) */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 10px 0; padding-bottom: calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 15px rgba(0,0,0,0.03); z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 11px; font-weight: 500; transition: color 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; margin-bottom: 4px; }
        
        /* Centralizar em Desktop */
        @media (min-width: 600px) {
            body { display: flex; flex-direction: column; align-items: center; }
            .app-header, .container, .bottom-nav { width: 100%; max-width: 500px; border-radius: 0; }
            .bottom-nav { border-radius: 20px 20px 0 0; }
        }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <div class="app-header">
        <div class="header-top">
            <div>
                <p style="font-size: 14px; opacity: 0.9;">Bem-vindo(a) de volta,</p>
                <div class="user-greeting">Futuro Condutor!</div>
            </div>
            <div class="avatar">👤</div>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <div class="container">
        
        <!-- Cartão de Resumo -->
        <div class="status-card">
            <div class="status-info">
                <h3>Progresso Geral</h3>
                <p>0%</p>
            </div>
            <div class="status-badge">Iniciante</div>
        </div>

        <div class="section-title">O que vamos estudar hoje?</div>
        
        <!-- Grelha de Módulos -->
        <div class="grid-menu">
            <a href="simulador.html" class="menu-card">
                <div class="menu-icon icon-blue">🚗</div>
                <h4>Simulador</h4>
                <p>Testes oficiais cronometrados</p>
            </a>
            
            <a href="#" class="menu-card">
                <div class="menu-icon icon-purple">📚</div>
                <h4>Sinais</h4>
                <p>Aprenda toda a sinalização</p>
            </a>
            
            <a href="#" class="menu-card">
                <div class="menu-icon icon-orange">📊</div>
                <h4>Estatísticas</h4>
                <p>Analise o seu desempenho</p>
            </a>
            
            <a href="#" class="menu-card">
                <div class="menu-icon icon-green">⚙️</div>
                <h4>Definições</h4>
                <p>Ajuste a sua conta</p>
            </a>
        </div>
    </div>

    <!-- Barra de Navegação Inferior (App) -->
    <div class="bottom-nav">
        <a href="home.html" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Início</span>
        </a>
        <a href="simulador.html" class="nav-item">
            <span class="nav-icon">📝</span>
            <span>Exames</span>
        </a>
        <a href="#" class="nav-item" onclick="sair()">
            <span class="nav-icon">🚪</span>
            <span>Sair</span>
        </a>
    </div>

    <script>
        function sair() {
            // Um efeito simples de saída voltando para o Index
            if(confirm("Tem a certeza que deseja terminar sessão?")) {
                window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
